<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario Firestore (Vanilla JS)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <span class="navbar-brand">Formulario → Firestore</span>
      </div>
    </nav>

    <main class="container my-4">
      <div class="row">
        <div class="col-lg-6">
          <div class="card mb-4">
            <div class="card-header">Ingresa tus datos</div>
            <div class="card-body">
              <form id="data-form">
                <div class="mb-3">
                  <label for="name" class="form-label">Nombre</label>
                  <input type="text" class="form-control" id="name" name="name" placeholder="Tu nombre" required>
                </div>
                <div class="mb-3">
                  <label for="email" class="form-label">Correo electrónico</label>
                  <input type="email" class="form-control" id="email" name="email" placeholder="tu@correo.com" required>
                </div>
                <div class="mb-3">
                  <label for="message" class="form-label">Mensaje (opcional)</label>
                  <textarea class="form-control" id="message" name="message" rows="3" placeholder="Escribe un mensaje..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Guardar</button>
                <span id="status" class="ms-3 small"></span>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-6">
          <div class="card">
            <div class="card-header d-flex align-items-center justify-content-between">
              <span>Últimos registros</span>
              <button id="refresh" class="btn btn-sm btn-outline-secondary">Refrescar</button>
            </div>
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                  <thead>
                    <tr>
                      <th>Nombre</th>
                      <th>Correo</th>
                      <th>Mensaje</th>
                      <th>Fecha</th>
                    </tr>
                  </thead>
                  <tbody id="rows">
                    <tr>
                      <td colspan="4" class="text-center p-4">Sin registros aún</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
